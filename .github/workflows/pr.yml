name: PR

# Lance le style et les tests unitaires sur chaque push et pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Style et tests
        run: ./gradlew ktlintCheck testDebugUnitTest

      - name: Captures Roborazzi
        run: ./gradlew verifyRoborazziDebug

      - name: Lint release
        # Garde-fou : assembleRelease (workflow Release) exécute
        # lintVitalRelease, qui a déjà bloqué un tag (v0.6.0, FullBackupContent).
        run: ./gradlew :app:lintVitalRelease
