name: Release

# Construit l'app à chaque tag « v… » (par exemple v0.2.0) et publie l'APK
# dans une release GitHub. Lançable aussi à la main depuis l'onglet Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Style et tests
        run: ./gradlew ktlintCheck testDebugUnitTest

      - name: Clé de signature
        id: keystore
        # Signe l'APK si le dépôt a les secrets ; sinon l'APK sort non signé.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/acrovox.jks"
          echo "path=$RUNNER_TEMP/acrovox.jks" >> "$GITHUB_OUTPUT"

      - name: Construire l'APK
        env:
          ACROVOX_VERSION: ${{ github.ref_name }}
          ACROVOX_VERSION_CODE: ${{ github.run_number }}
          ACROVOX_KEYSTORE: ${{ steps.keystore.outputs.path }}
          ACROVOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ACROVOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ACROVOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Renommer l'APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          name="acrovox-${GITHUB_REF_NAME}.apk"
          mv "$apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --generate-notes
